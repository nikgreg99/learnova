services:
  postgres:
    image: postgres:18
    container_name: learnova-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER:  ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${DB_PORT}:${DB_PORT}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/docker

volumes:
  postgres_data:
