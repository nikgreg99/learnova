spring:
  application:
    name: ${APP_NAME:learnova}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:${KEYCLOAK_SCHEME:http}://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8081}/realms/${KEYCLOAK_REALM:learnova}}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_SCHEME:http}://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8081}/realms/${KEYCLOAK_REALM:learnova}/protocol/openid-connect/certs}

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate
    show-sql: true

  sql:
    init:
      platform: postgres

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:learnova}

    publisher-confirm-type: correlated
    publisher-returns: true

    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 1
        max-concurrency: 5

        default-requeue-rejected: false

        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms

keycloak:
  scheme: ${KEYCLOAK_SCHEME:http}
  host: ${KEYCLOAK_HOST:localhost}
  port: ${KEYCLOAK_PORT:8081}
  realm: ${KEYCLOAK_REALM:learnova}
  admin:
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:learnova-admin-client}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
  sync-test-users:
    enabled: ${KEYCLOAK_SYNC_TEST_USERS:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
