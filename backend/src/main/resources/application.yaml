spring:
  application:
    name: ${APP_NAME:learnova}

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate
    show-sql: true

  sql:
    init:
      platform: postgres

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
