
spring:
  application:
    name: ${APP_NAME:learnova}

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate
    show-sql: true

  sql:
    init:
      platform: postgres

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: ${APP_PORT:8080}

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:learnova}

  admin:
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
